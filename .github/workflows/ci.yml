name: CI

# Every push to master/main or to a feature branch (NNN-name) and every pull request: core unit
# tests on all three platforms, UI checks, headless end-to-end journeys against the real core,
# the CEF application on all three platforms (with the shell smoke test under Xvfb on Linux) and
# a packaging dry run per platform.
# Release packages are produced by release.yml; docs/building.md is replayed by
# docs-build.yml.

on:
  push:
    branches: [master, main, '[0-9][0-9][0-9]-*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite"

jobs:
  lint:
    name: lint (formats, scripts, docs)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck python3-yaml
          # Same clang-format major version as the development host (.clang-format is tuned for it).
          pipx install clang-format==19.1.7
      - name: C++ formatting
        run: |
          clang-format --version
          git ls-files 'core/**/*.cpp' 'core/**/*.hpp' 'core/**/*.h' 'app/**/*.cpp' 'app/**/*.h' 'app/**/*.mm' \
            | xargs clang-format --dry-run --Werror
      - name: Shell scripts
        run: |
          shellcheck tools/*.sh tools/ci/*.sh packaging/appimage/build.sh packaging/appimage/AppRun tests/corpus/run.sh
          shellcheck -s sh packaging/deb-rpm/postinst packaging/deb-rpm/prerm packaging/deb-rpm/postrm \
            packaging/deb-rpm/rpm-post.sh packaging/deb-rpm/rpm-preun.sh packaging/deb-rpm/rpm-postun.sh
      - name: Path portability (Windows/macOS checkouts)
        run: python3 tools/path-portability-check.py
      - name: Path conversions (paths <-> text without the Windows code page, feature 002)
        run: python3 tools/path-conversion-check.py
      - name: Source completion table (feature 003 US8)
        # ui/src/views/source/fb2Elements.json is generated from resources/schema/*.xsd and committed.
        run: python3 tools/fb2-schema-elements.py --check
      - name: Workflow and docs checks
        run: |
          for f in .github/workflows/*.yml; do python3 -c "import yaml,sys; yaml.safe_load(open(sys.argv[1]))" "$f"; done
          python3 tools/extract-doc-commands.py --check
          python3 tools/extract-doc-commands.py linux --output build/replay-linux.sh
          bash -n build/replay-linux.sh
          python3 tools/extract-doc-commands.py macos --output build/replay-macos.sh
          bash -n build/replay-macos.sh
          python3 tools/extract-doc-commands.py windows --output build/replay-windows.ps1
      - name: Licence check (Constitution VI, T156)
        # Policy (licences that may be part of a GPL-3.0 work only; incompatible or unknown ones
        # fail), the editor's own licence statements (LICENSE, package metadata, About dialog,
        # docs) and up-to-date notices for the npm, engine and bundled-data sections; the native
        # rows are fully re-verified where the core is built (release.yml).
        run: python3 tools/licence-check.py --check
      - name: Script notices (GPL-3.0, feature 002 FR-097)
        # Every bundled script keeps the author, copyright and version notices of the original
        # script it was converted from (tests/scripts/notices.json).
        run: python3 tests/scripts/tools/check-notices.py
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Parity matrix (SC-003, T157)
        # Every row of docs/parity-matrix.md marked implemented names a command id that exists in
        # the UI registry and is exercised by the listed Playwright journey.
        run: node tools/parity-check.mjs

  core:
    name: core (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            preset: linux-core-release
          - name: windows
            os: windows-2025
            preset: windows-core-release
          - name: macos
            os: macos-15
            preset: macos-core-release
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config autoconf automake autoconf-archive libtool bison flex \
            libgtk-3-dev libnss3 libasound2 xvfb file

      - name: Generate the regional locales the core tests format dates under (feature 003)
        if: runner.os == 'Linux'
        run: sudo locale-gen ru_RU.UTF-8 uk_UA.UTF-8 en_US.UTF-8

      - name: Install Ninja (Windows/macOS)
        if: runner.os != 'Linux'
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install autoconf automake autoconf-archive libtool pkg-config

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          vcpkgJsonGlob: vcpkg.json
          runVcpkgInstall: false

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-${{ matrix.name }}-${{ hashFiles('vcpkg.json', 'CMakePresets.json') }}
          restore-keys: vcpkg-${{ matrix.name }}-

      - name: Configure
        shell: bash
        run: |
          set -o pipefail
          # vcpkg downloads occasionally fail with DNS errors on hosted runners: retry once.
          cmake --preset ${{ matrix.preset }} 2>&1 | tee "$RUNNER_TEMP/configure.log" || \
            { echo "::warning::configure failed once, retrying"; sleep 20; cmake --preset ${{ matrix.preset }} 2>&1 | tee -a "$RUNNER_TEMP/configure.log"; }
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      - name: Configure failure details
        if: failure()
        shell: bash
        run: tools/ci/annotate-failure.sh "$RUNNER_TEMP/configure.log" "Configure"

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build --preset ${{ matrix.preset }} 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Build failure details
        if: failure()
        shell: bash
        run: tools/ci/annotate-failure.sh "$RUNNER_TEMP/build.log" "Build"

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          ctest --preset ${{ matrix.preset }} -LE corpus --output-on-failure 2>&1 | tee "$RUNNER_TEMP/ctest.log"
      - name: Test failure details
        if: failure()
        shell: bash
        run: tools/ci/annotate-failure.sh "$RUNNER_TEMP/ctest.log" "Unit tests"

      - name: Upload core artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mfbe-core-${{ matrix.name }}
          path: |
            build/${{ matrix.preset }}/bin/
          if-no-files-found: ignore

  ui:
    name: ui (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025, macos-15]
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: i18n parity
        if: runner.os == 'Linux'
        # Catalogue parity (keys, plurals, placeholders), no untranslated Russian values, unique
        # menu/dialog accelerators, and no literal UI strings in the React sources (T098, SC-004).
        run: |
          node ../tools/i18n-check.mjs --strict-identical --accelerators
          node ../tools/i18n-literals.mjs
      - name: Upload UI bundle
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: mfbe-ui-dist
          path: ui/dist/

  e2e:
    name: e2e (headless, Linux)
    needs: [core, ui]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: mfbe-core-linux
          path: build/linux-core-release/bin
      - uses: actions/download-artifact@v4
        with:
          name: mfbe-ui-dist
          path: ui/dist
      - run: chmod +x build/linux-core-release/bin/* || true
      - run: npm ci
        working-directory: ui
      - run: npx playwright install --with-deps chromium
        working-directory: ui
      # The regional locales the date journeys start the core under (feature 003).
      - run: sudo locale-gen ru_RU.UTF-8 uk_UA.UTF-8 en_US.UTF-8
      - run: npm run test:e2e -- --grep-invert @perf
        working-directory: ui
        env:
          MFBE_CORE_BIN: ${{ github.workspace }}/build/linux-core-release/bin/mfbe-core
          MFBE_UI_DIST: ${{ github.workspace }}/ui/dist
      - name: Russian environment (feature 002; ru_RU.UTF-8, Cyrillic home and temp)
        # The start-up, open/save and Find journeys with the Russian system locale - the
        # interface follows it - and the folders the core and the journeys use under Cyrillic
        # names. The browsers stay where the previous step installed them (HOME moves).
        run: |
          sudo locale-gen ru_RU.UTF-8 uk_UA.UTF-8 en_US.UTF-8
          mkdir -p "$HOME_RU/tmp"
          HOME="$HOME_RU" TMPDIR="$HOME_RU/tmp" \
            npx playwright test --project=chromium us2-template us1-open-save us5-find-modeless
        working-directory: ui
        env:
          HOME_RU: /tmp/Пользователь
          LANG: ru_RU.UTF-8
          LC_ALL: ru_RU.UTF-8
          PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
          MFBE_CORE_BIN: ${{ github.workspace }}/build/linux-core-release/bin/mfbe-core
          MFBE_UI_DIST: ${{ github.workspace }}/ui/dist
      - name: Script benchmark (SC-008)
        # Bundled clean-up scripts on the generated 1 MB and 10 MB books, alone on one worker:
        # each 10 MB time at most 12 x its 1 MB time, each 1 MB time under 5 s x
        # MFBE_PERF_FACTOR (default 2, docs/performance.md).
        run: npx playwright test --grep @perf --workers=1 --reporter=list
        working-directory: ui
        env:
          MFBE_CORE_BIN: ${{ github.workspace }}/build/linux-core-release/bin/mfbe-core
          MFBE_UI_DIST: ${{ github.workspace }}/ui/dist
      - name: Script equivalence suite (142 converted packages; T127, SC-011)
        # Every snapshot of tests/scripts/snapshots/suite.json through run-script.mjs against
        # the release core (bundled scripts resolved from MFBE_SCRIPTS_SOURCE_DIR) and the built
        # UI; fails on any snapshot difference or a package without a snapshot.
        run: tests/scripts/run-all.sh --json build/script-suite-results.json
        env:
          MFBE_CORE_BIN: ${{ github.workspace }}/build/linux-core-release/bin/mfbe-core
          MFBE_UI_DIST: ${{ github.workspace }}/ui/dist
      - name: Upload script suite results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: script-suite-results
          path: build/script-suite-results.json
          if-no-files-found: ignore
      - name: Performance budgets (10 MB journeys; T150, SC-002)
        # The 150 MB image book is a local/nightly run (tests/bench/README.md): hosted runners
        # are slow and short on memory. Fails when a budget is exceeded.
        run: tests/bench/run.sh --skip-150 --json
        env:
          MFBE_CORE_BIN: ${{ github.workspace }}/build/linux-core-release/bin/mfbe-core
          MFBE_UI_DIST: ${{ github.workspace }}/ui/dist
          MFBE_BENCH_WORKDIR: ${{ runner.temp }}/mfbe-bench
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: tests/bench/results/
          if-no-files-found: ignore
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ui/playwright-report/
          if-no-files-found: ignore

  app:
    name: app (CEF shell, ${{ matrix.name }})
    needs: [core]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            preset: linux-app-release
            cef: linux64
          - name: windows
            os: windows-2025
            preset: windows-app-release
            cef: windows64
          - name: macos
            os: macos-15
            preset: macos-app-release
            cef: macosarm64
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config autoconf automake autoconf-archive libtool bison flex \
            libgtk-3-dev libnss3 libasound2 xvfb file rpm dpkg-dev patchelf

      - name: Install Ninja (Windows/macOS)
        if: runner.os != 'Linux'
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install autoconf automake autoconf-archive libtool pkg-config

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install WiX Toolset (.NET tool)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          dotnet --list-sdks
          # The WiX tool and its extensions are pinned to one exact version (feature 003, T005:
          # the version the last green release run installed, 7.0.0+b8977d6). Bump deliberately,
          # together with packaging/README.md, after a packaging smoke on this branch.
          $wixVersion = "7.0.0"
          $installed = (dotnet tool list --global) -match "^wix\s"
          if ($installed) { dotnet tool update --global wix --version $wixVersion 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/wix.log" }
          else { dotnet tool install --global wix --version $wixVersion 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/wix.log" }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          wix --version 2>&1 | Tee-Object -Append -FilePath "$env:RUNNER_TEMP/wix.log"
          $version = (wix --version).Trim()
          $major = $version.Split('.')[0]
          # WiX v7 asks every machine to acknowledge the Open Source Maintenance Fee EULA
          # (https://wixtoolset.org/osmf/). The fee applies to organisations above the revenue
          # threshold only; this independent open-source project is exempt and accepts the EULA.
          if ([int]$major -ge 7) { wix eula accept "wix$major" 2>&1 | Tee-Object -Append -FilePath "$env:RUNNER_TEMP/wix.log" }
          wix extension add -g "WixToolset.UI.wixext/$wixVersion" 2>&1 | Tee-Object -Append -FilePath "$env:RUNNER_TEMP/wix.log"
          if ($LASTEXITCODE -ne 0) { wix extension add -g WixToolset.UI.wixext 2>&1 | Tee-Object -Append -FilePath "$env:RUNNER_TEMP/wix.log" }
          wix extension add -g "WixToolset.Util.wixext/$wixVersion" 2>&1 | Tee-Object -Append -FilePath "$env:RUNNER_TEMP/wix.log"
          if ($LASTEXITCODE -ne 0) { wix extension add -g WixToolset.Util.wixext 2>&1 | Tee-Object -Append -FilePath "$env:RUNNER_TEMP/wix.log" }
          wix extension list -g 2>&1 | Tee-Object -Append -FilePath "$env:RUNNER_TEMP/wix.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: WiX failure details
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: tools/ci/annotate-failure.ps1 -Log "$env:RUNNER_TEMP/wix.log" -Title "WiX install"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          vcpkgJsonGlob: vcpkg.json
          runVcpkgInstall: false

      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-${{ matrix.name }}-${{ hashFiles('vcpkg.json', 'CMakePresets.json') }}
          restore-keys: vcpkg-${{ matrix.name }}-

      - name: Cache CEF distribution
        uses: actions/cache@v4
        with:
          path: third_party/downloads
          key: cef-${{ hashFiles('cmake/CefVersion.cmake') }}-${{ matrix.cef }}

      - name: Configure
        shell: bash
        run: |
          set -o pipefail
          # vcpkg downloads occasionally fail with DNS errors on hosted runners: retry once.
          cmake --preset ${{ matrix.preset }} 2>&1 | tee "$RUNNER_TEMP/configure.log" || \
            { echo "::warning::configure failed once, retrying"; sleep 20; cmake --preset ${{ matrix.preset }} 2>&1 | tee -a "$RUNNER_TEMP/configure.log"; }
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      - name: Configure failure details
        if: failure()
        shell: bash
        run: tools/ci/annotate-failure.sh "$RUNNER_TEMP/configure.log" "Configure"

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build --preset ${{ matrix.preset }} 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Build failure details
        if: failure()
        shell: bash
        run: tools/ci/annotate-failure.sh "$RUNNER_TEMP/build.log" "Build"

      # The shipped configuration is built without the test-only RPC hooks, so the core test
      # suite (which drives them) runs in the `core` job; here the application is exercised.
      - name: Shell unit tests (file dialog requests in each platform's terms, feature 002)
        shell: bash
        run: ctest --preset ${{ matrix.preset }} -L shell --output-on-failure

      - name: Version (Linux)
        if: runner.os == 'Linux'
        run: build/${{ matrix.preset }}/bin/mfbe --version

      - name: Version (macOS)
        if: runner.os == 'macOS'
        run: build/${{ matrix.preset }}/bin/mfbe.app/Contents/MacOS/mfbe --version

      - name: Shell smoke (Xvfb + CDP; real UI, file argument, About dialog)
        if: runner.os == 'Linux'
        run: |
          (cd ui && npm ci && npx playwright install chromium)
          tools/shell-smoke.sh
        env:
          MFBE_APP_BIN: ${{ github.workspace }}/build/${{ matrix.preset }}/bin/mfbe
          MFBE_SMOKE_REAL_UI: "1"
          MFBE_SMOKE_OPEN_FILE: tests/fixtures/books/modern-utf8.fb2
          MFBE_SMOKE_ABOUT: "1"

      - name: Shell smoke in a Russian environment (feature 002)
        # ru_RU.UTF-8, the shell's home and temporary folders under a Cyrillic name (the smoke
        # keeps its home in TMPDIR) and a Cyrillic-named book in a Cyrillic folder as the
        # start-up file.
        if: runner.os == 'Linux'
        run: |
          sudo locale-gen ru_RU.UTF-8 uk_UA.UTF-8 en_US.UTF-8
          mkdir -p "$HOME_RU/tmp" "$HOME_RU/Книги"
          cp tests/fixtures/books/modern-utf8.fb2 "$HOME_RU/Книги/Новая книга.fb2"
          TMPDIR="$HOME_RU/tmp" MFBE_SMOKE_OPEN_FILE="$HOME_RU/Книги/Новая книга.fb2" \
            tools/shell-smoke.sh
        env:
          HOME_RU: /tmp/Пользователь
          LANG: ru_RU.UTF-8
          LC_ALL: ru_RU.UTF-8
          MFBE_APP_BIN: ${{ github.workspace }}/build/${{ matrix.preset }}/bin/mfbe
          MFBE_SMOKE_REAL_UI: "1"
          MFBE_SMOKE_SCREENSHOT: build/shell-smoke-ru.png

      - name: Shell smoke of a portable copy (feature 002)
        # A `user` folder next to the shell holds the browser profile and the logs; nothing goes
        # into the per-user folders.
        if: runner.os == 'Linux'
        run: tools/shell-smoke.sh
        env:
          MFBE_APP_BIN: ${{ github.workspace }}/build/${{ matrix.preset }}/bin/mfbe
          MFBE_SMOKE_REAL_UI: "1"
          MFBE_SMOKE_PORTABLE: "1"
          MFBE_SMOKE_SCREENSHOT: build/shell-smoke-portable.png

      - name: Installed tree (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake --install build/${{ matrix.preset }} --prefix "$RUNNER_TEMP/mfbe-prefix" --strip
          "$RUNNER_TEMP/mfbe-prefix/bin/mfbe" --version
          "$RUNNER_TEMP/mfbe-prefix/bin/mfbe-core" --version
          test -f "$RUNNER_TEMP/mfbe-prefix/share/mfbe/ui/index.html"
          test -f "$RUNNER_TEMP/mfbe-prefix/share/mfbe/resources/schema/FictionBook.xsd"

      - name: Package
        run: cpack --preset ${{ matrix.preset }}

      - name: Package smoke (Linux)
        if: runner.os == 'Linux'
        run: |
          set -eux
          ls -l build/${{ matrix.preset }}/packages/
          image=$(ls build/${{ matrix.preset }}/packages/*.AppImage)
          "$image" --appimage-extract-and-run --version
          dpkg-deb -I build/${{ matrix.preset }}/packages/mfbe_*_amd64.deb
          dpkg -x build/${{ matrix.preset }}/packages/mfbe_*_amd64.deb "$RUNNER_TEMP/deb" && "$RUNNER_TEMP/deb/usr/bin/mfbe" --version
          rpm -qpi build/${{ matrix.preset }}/packages/mfbe-*.rpm && rpm -qp --scripts build/${{ matrix.preset }}/packages/mfbe-*.rpm | head -20
          APPIMAGE_EXTRACT_AND_RUN=1 MFBE_APP_BIN="$image" MFBE_SMOKE_REAL_UI=1 \
            MFBE_SMOKE_SCREENSHOT=build/shell-smoke-appimage.png tools/shell-smoke.sh

      - name: Package smoke (Windows - install, associations, uninstall)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = (Get-ChildItem build\${{ matrix.preset }}\packages\*.msi | Select-Object -First 1).FullName
          Write-Host "Installing $msi (per machine, Program Files)"
          $p = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v $env:RUNNER_TEMP\install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $env:RUNNER_TEMP\install.log -Tail 80; throw "msiexec install exit $($p.ExitCode)" }
          $exe = Join-Path $env:ProgramFiles "Maxima Fiction Book Editor\bin\mfbe.exe"
          if (-not (Test-Path $exe)) { throw "mfbe.exe not found at $exe" }
          # Feature 002: only the portable package has the `user` folder of a portable copy.
          if (Test-Path (Join-Path (Split-Path -Parent $exe) 'user')) { throw "the installed program has a user folder" }
          & $exe --version
          # The renamed CEF bootstrap must carry the editor's own version info and icon
          # (Start menu / Explorer show the executable's resources).
          $vi = (Get-Item $exe).VersionInfo
          if ($vi.ProductName -ne 'Maxima Fiction Book Editor') { throw "version info not stamped: ProductName='$($vi.ProductName)'" }
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
          if ($null -eq $icon -or $icon.Width -lt 16) { throw "the executable has no icon" }
          Write-Host "version info: $($vi.ProductName) $($vi.ProductVersion); icon $($icon.Width)x$($icon.Height)"
          $prog = (Get-ItemProperty HKLM:\Software\Classes\.fb2 -ErrorAction Stop).'(default)'
          if ($prog -ne 'MaximaFBE.fb2') { throw ".fb2 is associated with '$prog'" }
          $cmd = (Get-ItemProperty 'HKLM:\Software\Classes\MaximaFBE.fb2\shell\open\command').'(default)'
          Write-Host "open command: $cmd"
          if (-not (Test-Path 'HKLM:\Software\Classes\.fbd')) { throw ".fbd association missing" }
          tools/ci/windows-start-smoke.ps1 -Exe $exe
          # Feature 002: mfbe.exe carries the editor's manifest (UTF-8 process code page), and the
          # editor starts for standard users whose names hold non-English letters - 0.0.1 ended
          # at start-up for them (heap corruption 0xC0000374 for "Pröbe").
          $stamp = Get-ChildItem build\${{ matrix.preset }} -Recurse -Filter mfbe_stamp_resources.exe | Select-Object -First 1
          $manifest = (& $stamp.FullName --dump-manifest $exe) -join "`n"
          if ($manifest -notmatch 'activeCodePage[^>]*>UTF-8<') { Write-Host $manifest; throw "mfbe.exe does not carry the editor's manifest (UTF-8 code page)" }
          $users = @('reprouser', "Pr$([char]0x00F6)be", "$([char]0x0422)$([char]0x0435)$([char]0x0441)$([char]0x0442)")
          foreach ($user in $users) { tools/ci/windows-start-smoke.ps1 -Exe $exe -AsUser $user }
          Write-Host "Uninstalling"
          $u = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "msiexec uninstall exit $($u.ExitCode)" }
          if (Test-Path 'HKLM:\Software\Classes\.fb2') { throw ".fb2 association still present after uninstall" }
          if (Test-Path $exe) { throw "mfbe.exe still present after uninstall" }

      - name: Package smoke (Windows - portable ZIP)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = (Get-ChildItem build\${{ matrix.preset }}\packages\*-portable.zip | Select-Object -First 1).FullName
          # Unpacked into the user profile like a downloaded copy, outside Program Files.
          $dest = Join-Path $env:USERPROFILE 'Downloads\mfbe-portable-smoke'
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Expand-Archive -Path $zip -DestinationPath $dest
          $exe = (Get-ChildItem $dest -Recurse -Filter mfbe.exe | Select-Object -First 1).FullName
          if (-not $exe) { throw "bin\mfbe.exe not found in $zip" }
          # Feature 002: the portable copy keeps all of its data in its `user` folder.
          if (-not (Test-Path (Join-Path (Split-Path -Parent $exe) 'user') -PathType Container)) { throw "bin\user not found in $zip" }
          Write-Host "Portable copy: $exe"
          & $exe --version
          tools/ci/windows-start-smoke.ps1 -Exe $exe
          # Feature 002: standard users with non-English names (their copy lives outside the
          # runner's profile, which they cannot read), and the program in a folder with Cyrillic
          # letters ("Книги"; 0.0.1 ended with 0xC0000005 in mfbe.dll there).
          $shared = 'C:\mfbe-smoke\portable'
          if (Test-Path $shared) { Remove-Item $shared -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $shared
          $sharedExe = (Get-ChildItem $shared -Recurse -Filter mfbe.exe | Select-Object -First 1).FullName
          $users = @('reprouser', "Pr$([char]0x00F6)be", "$([char]0x0422)$([char]0x0435)$([char]0x0441)$([char]0x0442)")
          foreach ($user in $users) { tools/ci/windows-start-smoke.ps1 -Exe $sharedExe -AsUser $user }
          $cyrillic = Join-Path 'C:\mfbe-smoke' "$([char]0x041A)$([char]0x043D)$([char]0x0438)$([char]0x0433)$([char]0x0438)"
          if (Test-Path -LiteralPath $cyrillic) { Remove-Item -LiteralPath $cyrillic -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $cyrillic
          $cyrillicExe = (Get-ChildItem -LiteralPath $cyrillic -Recurse -Filter mfbe.exe | Select-Object -First 1).FullName
          Write-Host "Portable copy in a Cyrillic folder: $cyrillicExe"
          tools/ci/windows-start-smoke.ps1 -Exe $cyrillicExe

      - name: Russian-environment journey (Windows - installed and portable)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Feature 002: a standard user with a Cyrillic name, Russian regional formats and display
          # language opens a Cyrillic-named book in a Cyrillic folder with each package, saves it,
          # hides the status bar from the View menu and restarts (tools/ci/windows-russian-journey.ps1).
          # The MSI is installed again for it: the smoke step above removed it.
          $msi = (Get-ChildItem build\${{ matrix.preset }}\packages\*.msi | Select-Object -First 1).FullName
          $p = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v $env:RUNNER_TEMP\install-journey.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $env:RUNNER_TEMP\install-journey.log -Tail 80; throw "msiexec install exit $($p.ExitCode)" }
          tools/ci/windows-russian-journey.ps1 -Exe (Join-Path $env:ProgramFiles 'Maxima Fiction Book Editor\bin\mfbe.exe')
          $u = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "msiexec uninstall exit $($u.ExitCode)" }
          $zip = (Get-ChildItem build\${{ matrix.preset }}\packages\*-portable.zip | Select-Object -First 1).FullName
          tools/ci/windows-russian-journey.ps1 -Zip $zip

      - name: Package smoke (macOS)
        if: runner.os == 'macOS'
        run: |
          set -eux
          ls -l build/${{ matrix.preset }}/packages/
          dmg=$(ls build/${{ matrix.preset }}/packages/*.dmg)
          hdiutil attach "$dmg" -mountpoint "$RUNNER_TEMP/dmg" -nobrowse -readonly
          codesign --verify --deep --strict "$RUNNER_TEMP/dmg/mfbe.app"
          "$RUNNER_TEMP/dmg/mfbe.app/Contents/MacOS/mfbe" --version
          hdiutil detach "$RUNNER_TEMP/dmg"

      - name: Russian environment (macOS, best effort)
        if: runner.os == 'macOS'
        # Feature 002: Russian as the system language and a Cyrillic folder holding the bundle and
        # its portable data folder; the editor window must appear (tools/ci/macos-russian-start.sh).
        continue-on-error: true
        run: tools/ci/macos-russian-start.sh "$(ls build/${{ matrix.preset }}/packages/*.dmg)"

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.name }}
          path: |
            build/${{ matrix.preset }}/packages/*.AppImage
            build/${{ matrix.preset }}/packages/*.zsync
            build/${{ matrix.preset }}/packages/*.deb
            build/${{ matrix.preset }}/packages/*.rpm
            build/${{ matrix.preset }}/packages/*.msi
            build/${{ matrix.preset }}/packages/*.zip
            build/${{ matrix.preset }}/packages/*.dmg
            build/${{ matrix.preset }}/packages/*.sha256
          retention-days: 7
          if-no-files-found: error

      - name: Upload shell smoke screenshots
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: shell-smoke
          path: build/shell-smoke*.png
          if-no-files-found: ignore
