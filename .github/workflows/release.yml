name: Release

# Tag `vX.Y.Z` (a final version) or `vX.Y.Z-<label>.N` (a test build of the pre-release label
# committed in CMakeLists.txt, such as `v0.0.6-rc.1`, published as a GitHub pre-release), or run
# by hand with such a tag: builds the full application on every platform, runs the release gates
# that CI can run (unit tests, UI checks, end-to-end journeys, shell smoke, licence check),
# produces the packages with CPack, smoke-tests each package, and attaches MSI / portable ZIP /
# AppImage (+ .zsync) / .deb / .rpm / .dmg with SHA-256 checksums and the installation excerpt to
# a GitHub Release.
#
# The tag must fit the committed version (feature 006): each build checks it right after the
# checkout (tools/version-check.py --tag) and at every configure (cmake/MfbeVersion.cmake, the
# authority), and the packages carry its label (0.0.6-rc.N). A manual dry run without a tag
# builds untagged packages - the committed label, such as 0.0.6-rc, and an AppImage without
# update information and without a .zsync - and publishes nothing.
#
# Gates that cannot run here (Constitution IV/VI, documented in the release notes):
#   * the corpus round-trip/validation gate (tests/corpus/run.sh) needs the local book
#     collection (/book_disk/books) and is run on the development host before tagging;
#   * the performance budgets (tests/bench/, T150) run when that directory exists.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (leave empty for a dry run without a release)"
        required: false
        default: ""

permissions:
  contents: write

env:
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite"

jobs:
  build:
    name: build + package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    env:
      # The tag this run builds, read once (feature 006): a pushed tag, or the tag given to a
      # manual run; empty - untagged - for a manual dry run without one. Both configures read it
      # (cmake/MfbeVersion.cmake), and the step after the checkout checks it.
      MFBE_RELEASE_TAG: ${{ github.event.inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || '') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            preset: linux-app-release
            cef: linux64
          - name: windows
            os: windows-2025
            preset: windows-app-release
            cef: windows64
          - name: macos-arm64
            os: macos-15
            preset: macos-app-release
            cef: macosarm64
          - name: macos-x86_64
            os: macos-15-intel
            preset: macos-app-release
            cef: macosx64
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      # Feature 006 (FR-054, FR-055): the version forms of the run's tag, checked against the
      # committed version before anything is installed or built. A tag that does not fit
      # (v0.0.6 or v0.0.6-rc.0 while CMakeLists.txt commits 0.0.6-rc) fails here within seconds;
      # the configure's own check comes only after the vcpkg install. MFBE_VERSION (the label),
      # MFBE_VERSION_PACKAGE, MFBE_VERSION_NUMERIC, MFBE_VERSION_PRERELEASE,
      # MFBE_APPIMAGE_CHANNEL, ... go to $GITHUB_ENV for the package smokes.
      - name: Version forms of the tag (feature 006)
        shell: bash
        run: |
          set -o pipefail
          if python3 --version >/dev/null 2>&1; then python=python3; else python=python; fi
          "$python" tools/version-check.py --tag "$MFBE_RELEASE_TAG" | tee -a "$GITHUB_ENV"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config autoconf automake autoconf-archive libtool bison flex \
            libgtk-3-dev libnss3 libasound2 xvfb file rpm dpkg-dev patchelf python3-yaml shellcheck openbox xdotool

      - name: Generate the regional locales the core tests and journeys format dates under (feature 003)
        if: runner.os == 'Linux'
        run: sudo locale-gen ru_RU.UTF-8 uk_UA.UTF-8 en_US.UTF-8

      - name: Ninja (Windows/macOS)
        # The windows-2025 and macos-15 runner images ship Ninja; the install is only a fallback
        # for an image without it. (seanmiddleditch/gha-setup-ninja, used before, is archived and
        # stays on the Node 20 runtime.)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          if ! command -v ninja >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = "macOS" ]; then brew install ninja; else choco install ninja --no-progress -y; fi
          fi
          ninja --version

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install autoconf automake autoconf-archive libtool pkg-config

      - name: Set up MSVC environment
        # Still a Node 20 action (no release of it runs on Node 24; the runner forces Node 24 and
        # it works): the deprecation notice of this step is known.
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install WiX Toolset (.NET tool)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          dotnet --list-sdks
          # The WiX tool and its extensions are pinned to one exact version (feature 003, T005:
          # the version the last green release run installed, 7.0.0+b8977d6). Bump deliberately,
          # together with packaging/README.md, after a packaging smoke on this branch.
          $wixVersion = "7.0.0"
          $installed = (dotnet tool list --global) -match "^wix\s"
          if ($installed) { dotnet tool update --global wix --version $wixVersion 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/wix.log" }
          else { dotnet tool install --global wix --version $wixVersion 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/wix.log" }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          wix --version 2>&1 | Tee-Object -Append -FilePath "$env:RUNNER_TEMP/wix.log"
          $version = (wix --version).Trim()
          $major = $version.Split('.')[0]
          # WiX v7 asks every machine to acknowledge the Open Source Maintenance Fee EULA
          # (https://wixtoolset.org/osmf/). The fee applies to organisations above the revenue
          # threshold only; this independent open-source project is exempt and accepts the EULA.
          if ([int]$major -ge 7) { wix eula accept "wix$major" 2>&1 | Tee-Object -Append -FilePath "$env:RUNNER_TEMP/wix.log" }
          wix extension add -g "WixToolset.UI.wixext/$wixVersion" 2>&1 | Tee-Object -Append -FilePath "$env:RUNNER_TEMP/wix.log"
          if ($LASTEXITCODE -ne 0) { wix extension add -g WixToolset.UI.wixext 2>&1 | Tee-Object -Append -FilePath "$env:RUNNER_TEMP/wix.log" }
          wix extension add -g "WixToolset.Util.wixext/$wixVersion" 2>&1 | Tee-Object -Append -FilePath "$env:RUNNER_TEMP/wix.log"
          if ($LASTEXITCODE -ne 0) { wix extension add -g WixToolset.Util.wixext 2>&1 | Tee-Object -Append -FilePath "$env:RUNNER_TEMP/wix.log" }
          wix extension list -g 2>&1 | Tee-Object -Append -FilePath "$env:RUNNER_TEMP/wix.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: WiX failure details
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: tools/ci/annotate-failure.ps1 -Log "$env:RUNNER_TEMP/wix.log" -Title "WiX install"

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          vcpkgJsonGlob: vcpkg.json
          runVcpkgInstall: false

      - uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.vcpkg-cache
          key: vcpkg-${{ matrix.name }}-${{ hashFiles('vcpkg.json', 'CMakePresets.json') }}
          restore-keys: vcpkg-${{ matrix.name }}-

      - name: Cache CEF distribution
        uses: actions/cache@v5
        with:
          path: third_party/downloads
          key: cef-${{ hashFiles('cmake/CefVersion.cmake') }}-${{ matrix.cef }}

      - name: Configure
        shell: bash
        run: |
          set -o pipefail
          # vcpkg downloads occasionally fail with DNS errors on hosted runners: retry once.
          cmake --preset ${{ matrix.preset }} 2>&1 | tee "$RUNNER_TEMP/configure.log" || \
            { echo "::warning::configure failed once, retrying"; sleep 20; cmake --preset ${{ matrix.preset }} 2>&1 | tee -a "$RUNNER_TEMP/configure.log"; }
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      - name: Configure failure details
        if: failure()
        shell: bash
        run: tools/ci/annotate-failure.sh "$RUNNER_TEMP/configure.log" "Configure"

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build --preset ${{ matrix.preset }} 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Build failure details
        if: failure()
        shell: bash
        run: tools/ci/annotate-failure.sh "$RUNNER_TEMP/build.log" "Build"

      # --- gates -----------------------------------------------------------------------------
      # The shipped binaries are built without the test-only RPC hooks (constitution: compiled
      # out of release builds), so the automated gates run against a second, hooks-enabled
      # core configuration on Linux (the platform exercised end to end). The same vcpkg tree is
      # reused, so this adds only the core compile time.
      - name: Configure the test core (hooks enabled)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          cmake --preset linux-core-release 2>&1 | tee "$RUNNER_TEMP/configure-tests.log"
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      - name: Build the test core
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          cmake --build --preset linux-core-release 2>&1 | tee "$RUNNER_TEMP/build-tests.log"
      - name: Test core failure details
        if: failure() && runner.os == 'Linux'
        shell: bash
        run: tools/ci/annotate-failure.sh "$RUNNER_TEMP/build-tests.log" "Test core build"

      - name: Unit tests (Catch2)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          ctest --preset linux-core-release -LE corpus --output-on-failure 2>&1 | tee "$RUNNER_TEMP/ctest.log"
      - name: Unit test failure details
        if: failure() && runner.os == 'Linux'
        shell: bash
        run: tools/ci/annotate-failure.sh "$RUNNER_TEMP/ctest.log" "Unit tests"

      - name: UI checks
        working-directory: ui
        shell: bash
        run: |
          set -o pipefail
          { npm ci && npm run typecheck && npm run lint && npm test; } 2>&1 | tee "$RUNNER_TEMP/ui.log"
      - name: UI check failure details
        if: failure()
        shell: bash
        run: tools/ci/annotate-failure.sh "$RUNNER_TEMP/ui.log" "UI checks"

      - name: i18n parity
        if: runner.os == 'Linux'
        run: |
          node tools/i18n-check.mjs --strict-identical --accelerators
          node tools/i18n-literals.mjs

      - name: End-to-end journeys (headless Chromium, real core)
        if: runner.os == 'Linux'
        working-directory: ui
        shell: bash
        run: |
          set -o pipefail
          npx playwright install --with-deps chromium
          npm run test:e2e -- --grep-invert @perf 2>&1 | tee "$RUNNER_TEMP/e2e.log"
        env:
          MFBE_CORE_BIN: ${{ github.workspace }}/build/linux-core-release/bin/mfbe-core
          MFBE_UI_DIST: ${{ github.workspace }}/ui/dist
      - name: E2E failure details
        if: failure() && runner.os == 'Linux'
        shell: bash
        run: tools/ci/annotate-failure.sh "$RUNNER_TEMP/e2e.log" "End-to-end journeys"

      - name: Shell smoke (Xvfb + CDP)
        if: runner.os == 'Linux'
        run: tools/shell-smoke.sh
        env:
          MFBE_APP_BIN: ${{ github.workspace }}/build/${{ matrix.preset }}/bin/mfbe
          MFBE_SMOKE_REAL_UI: "1"
          MFBE_SMOKE_OPEN_FILE: tests/fixtures/books/modern-utf8.fb2
          MFBE_SMOKE_ABOUT: "1"

      - name: Shell smoke of the window's close button (feature 003 FR-017)
        if: runner.os == 'Linux'
        run: tools/shell-smoke.sh
        env:
          MFBE_APP_BIN: ${{ github.workspace }}/build/${{ matrix.preset }}/bin/mfbe
          MFBE_SMOKE_REAL_UI: "1"
          MFBE_SMOKE_OPEN_FILE: tests/fixtures/books/modern-utf8.fb2
          MFBE_SMOKE_CLOSE: "1"
          MFBE_SMOKE_SCREENSHOT: build/shell-smoke-close.png

      - name: Corpus gate (local only)
        if: runner.os == 'Linux'
        run: |
          echo "::notice::The corpus round-trip/validation gate (tests/corpus/run.sh) needs the local book collection and is run on the development host before tagging."

      - name: Performance budgets (10 MB journeys)
        if: runner.os == 'Linux'
        run: tests/bench/run.sh --skip-150 --json
        env:
          MFBE_CORE_BIN: ${{ github.workspace }}/build/linux-core-release/bin/mfbe-core
          MFBE_UI_DIST: ${{ github.workspace }}/ui/dist
          MFBE_BENCH_WORKDIR: ${{ runner.temp }}/mfbe-bench

      - name: Script benchmark (SC-008, times recorded)
        # As in CI (12 x ratio, 1 MB budget x MFBE_PERF_FACTOR); the measured times go to the job
        # summary and the script-benchmark artifact. The 5 s budget itself is confirmed on the
        # reference laptop in the release smoke test (docs/performance.md). The same run holds
        # every @perf journey, perf-tables among them (feature 006, SC-005): its medians follow
        # in a second table of the summary, read from tests/bench/results/table-commands.json.
        if: runner.os == 'Linux'
        working-directory: ui
        shell: bash
        run: |
          set -o pipefail
          npx playwright test --grep @perf --workers=1 --reporter=list 2>&1 | tee "$RUNNER_TEMP/script-bench.log"
          node -e '
            const { perfFactor, results } = require(process.argv[1]);
            console.log(`### Script benchmark (MFBE_PERF_FACTOR ${perfFactor})\n`);
            console.log("| Script | 1 MB (ms) | 10 MB (ms) |\n| --- | ---: | ---: |");
            for (const r of results) console.log(`| ${r.script} | ${r["1mb"]} | ${r["10mb"]} |`);
          ' "$MFBE_PERF_RESULTS" >> "$GITHUB_STEP_SUMMARY"
          node -e '
            const r = require(process.argv[1]);
            const keys = ["table300", "table628", "table298", "table1000"];
            const cell = (value) => (value === undefined ? "-" : String(value));
            console.log(`\n### Table commands (MFBE_PERF_FACTOR ${r.perfFactor})\n`);
            console.log("| Command | 300 × 10 median (ms) | 628 × 4 median (ms) | 298 × 14 median (ms) | 1000 × 20 (ms) |");
            console.log("| --- | ---: | ---: | ---: | ---: |");
            const names = [...new Set(keys.flatMap((key) => Object.keys(r[key] ?? {})))];
            for (const name of names) {
              console.log(`| ${name} | ${keys.map((key) => cell(r[key]?.[name])).join(" | ")} |`);
            }
            for (const paste of ["block", "table"]) {
              console.log(`| paste (${paste}) | ${keys.map((key) => cell(r.pastes?.[key]?.[paste])).join(" | ")} |`);
            }
          ' "$MFBE_TABLE_RESULTS" >> "$GITHUB_STEP_SUMMARY"
        env:
          MFBE_CORE_BIN: ${{ github.workspace }}/build/linux-core-release/bin/mfbe-core
          MFBE_UI_DIST: ${{ github.workspace }}/ui/dist
          MFBE_PERF_RESULTS: ${{ github.workspace }}/tests/bench/results/script-benchmark.json
          MFBE_TABLE_RESULTS: ${{ github.workspace }}/tests/bench/results/table-commands.json
      - name: Script benchmark failure details
        if: failure() && runner.os == 'Linux'
        shell: bash
        run: tools/ci/annotate-failure.sh "$RUNNER_TEMP/script-bench.log" "Script benchmark"
      - name: Upload script benchmark
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: script-benchmark
          path: |
            tests/bench/results/script-benchmark.json
            tests/bench/results/table-commands.json
          if-no-files-found: ignore

      - name: Licence check (blocking, Constitution VI)
        # Full verification against the installed vcpkg tree of this build: every native,
        # engine, npm and bundled-data component has an MIT-compatible licence and a licence
        # text, and THIRD-PARTY-NOTICES.md is the exact output of the tool.
        if: runner.os == 'Linux'
        run: python3 tools/licence-check.py --check

      # --- packages ---------------------------------------------------------------------------
      - name: Package
        shell: bash
        run: |
          set -o pipefail
          cpack --preset ${{ matrix.preset }} --verbose 2>&1 | tee "$RUNNER_TEMP/package.log"
      - name: Package failure details
        if: failure()
        shell: bash
        run: |
          tools/ci/annotate-failure.sh "$RUNNER_TEMP/package.log" "Package"
          # Generator logs with the actual tool errors (WiX on Windows, rpmbuild/dpkg on Linux).
          for log in build/${{ matrix.preset }}/packages/_CPack_Packages/*/WIX/wix.log \
                     build/${{ matrix.preset }}/packages/_CPack_Packages/*/RPM/rpmbuild*.err \
                     build/${{ matrix.preset }}/packages/_CPack_Packages/*/DEB/*.log; do
            [ -f "$log" ] && tools/ci/annotate-failure.sh "$log" "$(basename "$log")"
          done
          true
      - name: Package failure details (WiX log)
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $log = "build\${{ matrix.preset }}\packages\_CPack_Packages\win64\WIX\wix.log"
          if (Test-Path $log) { Get-Content $log | Select-String -Pattern 'error|warning' -Context 0,2 | Select-Object -First 80 } else { Write-Host "no $log" }

      - name: Package smoke (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          {
          set -eux
          : "${MFBE_VERSION:?no MFBE_VERSION from the version check of the tag}"
          packages=build/${{ matrix.preset }}/packages
          ls -l "$packages/"
          # Feature 006 (FR-055): the forms of the run's tag (tools/version-check.py, first step):
          # the file names carry the label (0.0.6-rc.N from v0.0.6-rc.N), the deb and rpm versions
          # the package form (0.0.6~rc.N, before the final), and the AppImage has a .zsync exactly
          # when it embeds update information (a tag), never when untagged (a dry run).
          image="$packages/MaximaFictionBookEditor-${MFBE_VERSION}-x86_64.AppImage"
          deb="$packages/mfbe_${MFBE_VERSION}_amd64.deb"
          rpm="$packages/mfbe-${MFBE_VERSION}-1.x86_64.rpm"
          test -f "$image" && test -f "$deb" && test -f "$rpm"
          test "$(dpkg-deb -f "$deb" Version)" = "$MFBE_VERSION_PACKAGE"
          test "$(rpm -qp --qf '%{VERSION}' "$rpm")" = "$MFBE_VERSION_PACKAGE"
          if [ -n "${MFBE_VERSION_PRERELEASE:-}" ]; then
            dpkg --compare-versions "$MFBE_VERSION_PACKAGE" lt "$MFBE_VERSION_NUMERIC"
          fi
          if [ -n "${MFBE_APPIMAGE_CHANNEL:-}" ]; then
            test -f "$image.zsync"
          else
            test -z "$(find "$packages" -maxdepth 1 -name '*.zsync')"
          fi
          version_line="Maxima Fiction Book Editor $MFBE_VERSION (build $MFBE_VERSION+"
          "$image" --appimage-extract-and-run --version | tee "$RUNNER_TEMP/version-appimage.txt"
          grep -qF "$version_line" "$RUNNER_TEMP/version-appimage.txt"
          APPIMAGE_EXTRACT_AND_RUN=1 MFBE_APP_BIN="$image" MFBE_SMOKE_REAL_UI=1 \
            MFBE_SMOKE_SCREENSHOT=build/shell-smoke-appimage.png tools/shell-smoke.sh
          dpkg-deb -I "$deb"
          dpkg -x "$deb" "$RUNNER_TEMP/deb"
          "$RUNNER_TEMP/deb/usr/bin/mfbe" --version | tee "$RUNNER_TEMP/version-deb.txt"
          grep -qF "$version_line" "$RUNNER_TEMP/version-deb.txt"
          rpm -qpi "$rpm"
          rpm -qpR "$rpm" | grep -q 'libgtk-3.so.0'
          } 2>&1 | tee "$RUNNER_TEMP/smoke.log"
      - name: Package smoke failure details
        if: failure() && runner.os == 'Linux'
        shell: bash
        run: tools/ci/annotate-failure.sh "$RUNNER_TEMP/smoke.log" "Package smoke"

      - name: Package smoke (Windows - install, associations, uninstall)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Feature 006 (FR-055): the forms of the run's tag (tools/version-check.py, first step);
          # the MSI's name carries the version label (0.0.6-rc.N from v0.0.6-rc.N).
          if (-not $env:MFBE_VERSION) { throw "no MFBE_VERSION from the version check of the tag" }
          $msi = Join-Path "build\${{ matrix.preset }}\packages" "MaximaFictionBookEditor-${env:MFBE_VERSION}-win64.msi"
          if (-not (Test-Path -LiteralPath $msi)) { Get-ChildItem build\${{ matrix.preset }}\packages | ForEach-Object { Write-Host $_.Name }; throw "no MSI named for the version label: $msi" }
          $msi = (Resolve-Path -LiteralPath $msi).Path
          $p = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v $env:RUNNER_TEMP\install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $env:RUNNER_TEMP\install.log -Tail 80; throw "msiexec install exit $($p.ExitCode)" }
          $exe = Join-Path $env:ProgramFiles "Maxima Fiction Book Editor\bin\mfbe.exe"
          # Feature 006: Apps & features names the build with its label while the version has a
          # pre-release part, and shows the numeric version (MSI ProductVersion).
          $expectedName = if ($env:MFBE_VERSION_PRERELEASE) { "MaximaFictionBookEditor $env:MFBE_VERSION" } else { 'MaximaFictionBookEditor' }
          $entries = @(Get-ChildItem 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall' | ForEach-Object { Get-ItemProperty -LiteralPath $_.PSPath -ErrorAction SilentlyContinue } | Where-Object { $_.DisplayName -like 'MaximaFictionBookEditor*' })
          if ($entries.Count -ne 1) { throw "expected one Apps & features entry, found $($entries.Count): $($entries.DisplayName -join ', ')" }
          Write-Host "Apps & features: '$($entries[0].DisplayName)', version $($entries[0].DisplayVersion)"
          if ($entries[0].DisplayName -ne $expectedName) { throw "Apps & features shows '$($entries[0].DisplayName)', expected '$expectedName'" }
          if ($entries[0].DisplayVersion -ne $env:MFBE_VERSION_NUMERIC) { throw "Apps & features version '$($entries[0].DisplayVersion)', expected '$env:MFBE_VERSION_NUMERIC'" }
          # Feature 006: --version names the label and the build id. mfbe.exe writes it to the
          # console it attaches to, which a step does not capture: the helper reads it.
          $versionText = (tools/ci/windows-program-output.ps1 -Exe $exe) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "mfbe.exe --version exit $LASTEXITCODE" }
          Write-Host $versionText
          if ($versionText -notlike "*Maxima Fiction Book Editor ${env:MFBE_VERSION} (build ${env:MFBE_VERSION}+*") { throw "mfbe.exe --version does not name the version label $env:MFBE_VERSION and its build id" }
          # The renamed CEF bootstrap must carry the editor's own version info and icon
          # (Start menu / Explorer show the executable's resources).
          $vi = (Get-Item $exe).VersionInfo
          if ($vi.ProductName -ne 'Maxima Fiction Book Editor') { throw "version info not stamped: ProductName='$($vi.ProductName)'" }
          # Feature 006: the version strings carry the label, the binary file version the numbers
          # (FR-055, decision 14); the copyright names the project's licence (FR-066).
          if ($vi.ProductVersion -ne $env:MFBE_VERSION) { throw "ProductVersion '$($vi.ProductVersion)', expected '$env:MFBE_VERSION'" }
          if ($vi.FileVersion -ne $env:MFBE_VERSION) { throw "FileVersion '$($vi.FileVersion)', expected '$env:MFBE_VERSION'" }
          if ("$($vi.FileVersionRaw)" -ne "${env:MFBE_VERSION_NUMERIC}.0") { throw "FileVersionRaw '$($vi.FileVersionRaw)', expected '${env:MFBE_VERSION_NUMERIC}.0'" }
          if ($vi.LegalCopyright -notmatch 'GPL-3\.0-only') { throw "LegalCopyright '$($vi.LegalCopyright)' does not name GPL-3.0-only" }
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
          if ($null -eq $icon -or $icon.Width -lt 16) { throw "the executable has no icon" }
          Write-Host "version info: $($vi.ProductName) $($vi.ProductVersion); icon $($icon.Width)x$($icon.Height)"
          if ((Get-ItemProperty HKLM:\Software\Classes\.fb2).'(default)' -ne 'MaximaFBE.fb2') { throw ".fb2 association missing" }
          if ((Get-ItemProperty HKLM:\Software\Classes\.fbd).'(default)' -ne 'MaximaFBE.fbd') { throw ".fbd association missing" }
          tools/ci/windows-start-smoke.ps1 -Exe $exe
          # Feature 002: mfbe.exe carries the editor's manifest (UTF-8 process code page), and the
          # editor starts for standard users whose names hold non-English letters - 0.0.1 ended
          # at start-up for them (heap corruption 0xC0000374 for "Pröbe").
          $stamp = Get-ChildItem build\${{ matrix.preset }} -Recurse -Filter mfbe_stamp_resources.exe | Select-Object -First 1
          $manifest = (& $stamp.FullName --dump-manifest $exe) -join "`n"
          if ($manifest -notmatch 'activeCodePage[^>]*>UTF-8<') { Write-Host $manifest; throw "mfbe.exe does not carry the editor's manifest (UTF-8 code page)" }
          $users = @('reprouser', "Pr$([char]0x00F6)be", "$([char]0x0422)$([char]0x0435)$([char]0x0441)$([char]0x0442)")
          foreach ($user in $users) { tools/ci/windows-start-smoke.ps1 -Exe $exe -AsUser $user }
          $u = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "msiexec uninstall exit $($u.ExitCode)" }
          if (Test-Path 'HKLM:\Software\Classes\.fb2') { throw ".fb2 association still present after uninstall" }
      - name: Package smoke failure details (Windows)
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: tools/ci/annotate-failure.ps1 -Log "$env:RUNNER_TEMP\install.log" -Title "MSI install log"

      - name: Package smoke (Windows - desktop shortcut, upgrade)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Feature 003 (US7, contracts/installer.md): the MSI creates a desktop shortcut by default,
          # INSTALLDESKTOPSHORTCUT=0 declines it, a major upgrade keeps the recorded choice either
          # way, and uninstalling removes the shortcut and the record. The upgrade needs a second
          # MSI of the same version with another ProductCode (re-running the same file is only a
          # maintenance install): cpack builds the WIX package again into another folder.
          $msi = (Get-ChildItem build\${{ matrix.preset }}\packages\*.msi | Select-Object -First 1).FullName
          $upgradeDir = Join-Path $env:RUNNER_TEMP 'mfbe-upgrade'
          $ErrorActionPreference = 'Continue'  # cpack's messages on stderr are not errors
          # A fresh ProductCode for the second MSI: CPack keeps the generated GUID of a configuration,
          # so the rebuilt package would otherwise be the same product (a maintenance install).
          $upgradeGuid = [guid]::NewGuid().ToString().ToUpper()
          cpack -G WIX -B $upgradeDir -D "CPACK_WIX_PRODUCT_GUID=$upgradeGuid" --config build\${{ matrix.preset }}\CPackConfig.cmake 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\package-upgrade.log"
          $cpackExit = $LASTEXITCODE
          $ErrorActionPreference = 'Stop'
          if ($cpackExit -ne 0) { exit $cpackExit }
          $msi2 = (Get-ChildItem (Join-Path $upgradeDir '*.msi') | Select-Object -First 1).FullName
          if (-not $msi2) { throw "no second MSI in $upgradeDir" }
          $lnk = Join-Path ([Environment]::GetFolderPath('CommonDesktopDirectory')) 'Maxima Fiction Book Editor.lnk'
          $exe = Join-Path $env:ProgramFiles 'Maxima Fiction Book Editor\bin\mfbe.exe'
          function Install-Msi([string]$Path, [string]$Log, [string]$Properties = '') {
            $p = Start-Process msiexec -ArgumentList "/i `"$Path`" /qn $Properties /l*v `"$Log`"" -Wait -PassThru
            if ($p.ExitCode -ne 0) { Get-Content $Log -Tail 80; throw "msiexec install exit $($p.ExitCode)" }
          }
          function Uninstall-Msi([string]$Path) {
            $u = Start-Process msiexec -ArgumentList "/x `"$Path`" /qn" -Wait -PassThru
            if ($u.ExitCode -ne 0) { throw "msiexec uninstall exit $($u.ExitCode)" }
            if (Test-Path -LiteralPath $lnk) { throw "the desktop shortcut survived the uninstall" }
            if ($null -ne (Get-Choice)) { throw "the recorded choice survived the uninstall" }
            if (Test-Path $exe) { throw "mfbe.exe still present after uninstall" }
          }
          # The recorded choice (HKLM\Software\Maxima Fiction Book Editor\DesktopShortcut) and the
          # ProductCodes registered under Uninstall (one, and a new one after the upgrade).
          function Get-Choice { (Get-ItemProperty -LiteralPath 'HKLM:\Software\Maxima Fiction Book Editor' -Name DesktopShortcut -ErrorAction SilentlyContinue).DesktopShortcut }
          function Get-ProductCodes {
            @(Get-ChildItem 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall' -ErrorAction SilentlyContinue | Where-Object {
              (Get-ItemProperty -LiteralPath $_.PSPath -ErrorAction SilentlyContinue).DisplayName -like '*Fiction*Book*Editor*' } | ForEach-Object { $_.PSChildName })
          }
          Write-Host "Installing $msi with the default: a desktop shortcut"
          Install-Msi $msi "$env:RUNNER_TEMP\install-shortcut.log"
          if (-not (Test-Path -LiteralPath $lnk)) { throw "no desktop shortcut at $lnk" }
          $link = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk)
          Write-Host "Shortcut target '$($link.TargetPath)', icon '$($link.IconLocation)', start in '$($link.WorkingDirectory)'"
          if ($link.TargetPath -ne $exe) { throw "the shortcut points to '$($link.TargetPath)', not to $exe" }
          $iconFile = ($link.IconLocation -split ',')[0]
          if (-not $iconFile -or -not (Test-Path -LiteralPath $iconFile)) { throw "the shortcut has no icon file ('$($link.IconLocation)')" }
          if ((Get-Choice) -ne '1') { throw "recorded choice '$(Get-Choice)', expected 1" }
          $codes = @(Get-ProductCodes)  # @(): one code must stay an array, not a string
          if ($codes.Count -ne 1) { throw "expected one registered product, found $($codes.Count): $($codes -join ', ')" }
          tools/ci/windows-start-smoke.ps1 -Shortcut $lnk
          Write-Host "Upgrading with $msi2 without the property: the shortcut stays"
          Install-Msi $msi2 "$env:RUNNER_TEMP\install-shortcut-upgrade.log"
          $codesAfter = @(Get-ProductCodes)
          Write-Host "Registered products before the upgrade: $($codes -join ', '); after: $($codesAfter -join ', ')"
          if ($codesAfter.Count -ne 1 -or $codesAfter[0] -eq $codes[0]) {
            Write-Host "::warning::unexpected product registration after the upgrade (see the upgrade log below)"
            Get-Content "$env:RUNNER_TEMP\install-shortcut-upgrade.log" | Select-String -Pattern 'Product: |RemoveExistingProducts|Return value 3|FindRelatedProducts|MIGRATE|Upgrade' | Select-Object -First 40
            Get-ChildItem 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall' | ForEach-Object { $n = (Get-ItemProperty -LiteralPath $_.PSPath -ErrorAction SilentlyContinue).DisplayName; if ($n -like '*Maxima*' -or $n -like '*mfbe*') { Write-Host "  $($_.PSChildName): $n" } }
          }
          if (-not (Test-Path $exe)) { throw "mfbe.exe missing after the upgrade" }
          if (-not (Test-Path -LiteralPath $lnk)) { throw "the upgrade removed the desktop shortcut" }
          if ((Get-Choice) -ne '1') { throw "recorded choice after the upgrade '$(Get-Choice)', expected 1" }
          Write-Host "Uninstalling: the shortcut goes"
          Uninstall-Msi $msi2
          Write-Host "Installing $msi with INSTALLDESKTOPSHORTCUT=0"
          Install-Msi $msi "$env:RUNNER_TEMP\install-noshortcut.log" 'INSTALLDESKTOPSHORTCUT=0'
          if (Test-Path -LiteralPath $lnk) { throw "INSTALLDESKTOPSHORTCUT=0 created a desktop shortcut" }
          if ((Get-Choice) -ne '0') { throw "recorded choice '$(Get-Choice)', expected 0" }
          if (-not (Test-Path $exe)) { throw "mfbe.exe not found at $exe" }
          Write-Host "Upgrading with $msi2 without the property: still no shortcut"
          Install-Msi $msi2 "$env:RUNNER_TEMP\install-noshortcut-upgrade.log"
          if (Test-Path -LiteralPath $lnk) { throw "the upgrade added a declined desktop shortcut" }
          if ((Get-Choice) -ne '0') { throw "recorded choice after the upgrade '$(Get-Choice)', expected 0" }
          Write-Host "Uninstalling"
          Uninstall-Msi $msi2

      - name: Package smoke (Windows - portable ZIP)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Feature 006 (FR-055): the ZIP's name carries the version label of the run's tag.
          if (-not $env:MFBE_VERSION) { throw "no MFBE_VERSION from the version check of the tag" }
          $zip = Join-Path "build\${{ matrix.preset }}\packages" "MaximaFictionBookEditor-${env:MFBE_VERSION}-win64-portable.zip"
          if (-not (Test-Path -LiteralPath $zip)) { Get-ChildItem build\${{ matrix.preset }}\packages | ForEach-Object { Write-Host $_.Name }; throw "no portable ZIP named for the version label: $zip" }
          $zip = (Resolve-Path -LiteralPath $zip).Path
          # Unpacked into the user profile like a downloaded copy, outside Program Files.
          $dest = Join-Path $env:USERPROFILE 'Downloads\mfbe-portable-smoke'
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Expand-Archive -Path $zip -DestinationPath $dest
          $exe = (Get-ChildItem $dest -Recurse -Filter mfbe.exe | Select-Object -First 1).FullName
          if (-not $exe) { throw "bin\mfbe.exe not found in $zip" }
          Write-Host "Portable copy: $exe"
          & $exe --version
          tools/ci/windows-start-smoke.ps1 -Exe $exe
          # Feature 002: standard users with non-English names (their copy lives outside the
          # runner's profile, which they cannot read), and the program in a folder with Cyrillic
          # letters ("Книги"; 0.0.1 ended with 0xC0000005 in mfbe.dll there).
          $shared = 'C:\mfbe-smoke\portable'
          if (Test-Path $shared) { Remove-Item $shared -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $shared
          $sharedExe = (Get-ChildItem $shared -Recurse -Filter mfbe.exe | Select-Object -First 1).FullName
          $users = @('reprouser', "Pr$([char]0x00F6)be", "$([char]0x0422)$([char]0x0435)$([char]0x0441)$([char]0x0442)")
          foreach ($user in $users) { tools/ci/windows-start-smoke.ps1 -Exe $sharedExe -AsUser $user }
          $cyrillic = Join-Path 'C:\mfbe-smoke' "$([char]0x041A)$([char]0x043D)$([char]0x0438)$([char]0x0433)$([char]0x0438)"
          if (Test-Path -LiteralPath $cyrillic) { Remove-Item -LiteralPath $cyrillic -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $cyrillic
          $cyrillicExe = (Get-ChildItem -LiteralPath $cyrillic -Recurse -Filter mfbe.exe | Select-Object -First 1).FullName
          Write-Host "Portable copy in a Cyrillic folder: $cyrillicExe"
          tools/ci/windows-start-smoke.ps1 -Exe $cyrillicExe

      - name: Russian-environment journey (Windows - installed and portable)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Feature 002: a standard user with a Cyrillic name, Russian regional formats and display
          # language opens a Cyrillic-named book in a Cyrillic folder with each package, saves it,
          # hides the status bar from the View menu and restarts (tools/ci/windows-russian-journey.ps1).
          # Feature 004 (US6, SC-006): the same user saves a new document through the native Save
          # dialog, driven with UI Automation - the proposed "Толстой Лев - Война и мир.fb2" and a
          # typed Cyrillic name come out with the same letters on disk, in the title bar and in
          # recent.json. The MSI is installed again for it: the smoke step above removed it.
          $msi = (Get-ChildItem build\${{ matrix.preset }}\packages\*.msi | Select-Object -First 1).FullName
          $p = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v $env:RUNNER_TEMP\install-journey.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $env:RUNNER_TEMP\install-journey.log -Tail 80; throw "msiexec install exit $($p.ExitCode)" }
          tools/ci/windows-russian-journey.ps1 -Exe (Join-Path $env:ProgramFiles 'Maxima Fiction Book Editor\bin\mfbe.exe')
          $u = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "msiexec uninstall exit $($u.ExitCode)" }
          $zip = (Get-ChildItem build\${{ matrix.preset }}\packages\*-portable.zip | Select-Object -First 1).FullName
          tools/ci/windows-russian-journey.ps1 -Zip $zip

      - name: Package smoke (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -o pipefail
          {
          set -eux
          : "${MFBE_VERSION:?no MFBE_VERSION from the version check of the tag}"
          # Feature 006: the dmg's name carries the version label of the run's tag; both version
          # keys of the bundle and its helpers the numeric form (Apple wants three integers
          # there); the copyright the project's licence (FR-066); --version the label and the
          # build id.
          dmg="build/${{ matrix.preset }}/packages/MaximaFictionBookEditor-${MFBE_VERSION}-macos-$(uname -m).dmg"
          test -f "$dmg"
          hdiutil attach "$dmg" -mountpoint "$RUNNER_TEMP/dmg" -nobrowse -readonly
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/dmg/mfbe.app" || {
            codesign -dvvv "$RUNNER_TEMP/dmg/mfbe.app" || true
            exit 1
          }
          app="$RUNNER_TEMP/dmg/mfbe.app"
          for plist in "$app/Contents/Info.plist" "$app"/Contents/Frameworks/*.app/Contents/Info.plist; do
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = "$MFBE_VERSION_NUMERIC"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" = "$MFBE_VERSION_NUMERIC"
          done
          /usr/libexec/PlistBuddy -c 'Print :NSHumanReadableCopyright' "$app/Contents/Info.plist" | grep 'GPL-3\.0-only'
          out=$("$app/Contents/MacOS/mfbe" --version); echo "$out"
          [[ "$out" == *"Maxima Fiction Book Editor $MFBE_VERSION (build $MFBE_VERSION+"* ]] ||
            { echo "::error::mfbe --version does not name the version label $MFBE_VERSION"; exit 1; }
          hdiutil detach "$RUNNER_TEMP/dmg"
          } 2>&1 | tee "$RUNNER_TEMP/smoke.log"
      - name: Package smoke failure details
        if: failure() && runner.os == 'macOS'
        shell: bash
        run: tools/ci/annotate-failure.sh "$RUNNER_TEMP/smoke.log" "Package smoke"

      - name: Upload packages
        uses: actions/upload-artifact@v6
        with:
          name: packages-${{ matrix.name }}
          path: |
            build/${{ matrix.preset }}/packages/*.AppImage
            build/${{ matrix.preset }}/packages/*.zsync
            build/${{ matrix.preset }}/packages/*.deb
            build/${{ matrix.preset }}/packages/*.rpm
            build/${{ matrix.preset }}/packages/*.msi
            build/${{ matrix.preset }}/packages/*.zip
            build/${{ matrix.preset }}/packages/*.dmg
          if-no-files-found: error

  release:
    name: publish GitHub Release
    needs: [build]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
    env:
      # The tag of the build job, read the same way (feature 006).
      MFBE_RELEASE_TAG: ${{ github.event.inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || '') }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v7
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true

      - name: Checksums and release notes
        run: |
          set -eux
          cd dist
          rm -f SHA256SUMS
          sha256sum -- * | tee SHA256SUMS
          cd ..
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          {
            echo "## Maxima Fiction Book Editor ${tag#v}"
            echo
            echo "| Platform | File |"
            echo "|----------|------|"
            # Rows in a fixed order: Windows, Linux, macOS.
            for pattern in '*.msi' '*-portable.zip' '*.AppImage' '*.deb' '*.rpm' '*arm64*.dmg' '*x86_64*.dmg'; do
              for f in dist/$pattern; do
                [ -e "$f" ] || continue
                case "$f" in
                  *.msi) echo "| Windows 10/11 x64 (installer with administrator prompt; \`C:\\Program Files\\Maxima Fiction Book Editor\`) | \`$(basename "$f")\` |" ;;
                  *-portable.zip) echo "| Windows 10/11 x64, portable (no installation: unzip anywhere and start \`bin\\mfbe.exe\`) | \`$(basename "$f")\` |" ;;
                  *.AppImage) echo "| Linux x86_64, any distribution (make executable and run) | \`$(basename "$f")\` |" ;;
                  *.deb) echo "| Debian / Ubuntu 22.04+ (\`sudo apt install ./<file>\`) | \`$(basename "$f")\` |" ;;
                  *.rpm) echo "| Fedora 39+ / openSUSE (\`sudo dnf install ./<file>\` / \`sudo zypper install ./<file>\`) | \`$(basename "$f")\` |" ;;
                  *arm64*.dmg) echo "| macOS 13+ on Apple Silicon (drag to Applications; first launch: Privacy & Security > Open Anyway) | \`$(basename "$f")\` |" ;;
                  *x86_64*.dmg) echo "| macOS 13+ on Intel (drag to Applications; first launch: Privacy & Security > Open Anyway) | \`$(basename "$f")\` |" ;;
                esac
              done
            done
            echo
            echo "When installing the MSI, Windows may show *Windows protected your PC* (Microsoft Defender SmartScreen; the installer is not code-signed): click **More info**, then **Run anyway**. The portable version shows the same notice the first time \`bin\\mfbe.exe\` is started."
            echo
            echo "Installation and uninstallation steps for every platform, the sandbox notes for Linux and the per-user folder locations: [docs/installing.md](https://github.com/${{ github.repository }}/blob/${tag}/docs/installing.md). \`SHA256SUMS\` lists the checksums of all files."
            echo
            echo "Release gates: unit tests, UI checks, end-to-end journeys and the shell smoke test ran in this workflow; the corpus round-trip/validation gate runs on the development host before tagging."
          } > release-notes.md
          cat release-notes.md

      - name: Create or update the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Maxima Fiction Book Editor ${{ github.event.inputs.tag || github.ref_name }}
          body_path: release-notes.md
          draft: false
          # A tag with "-" (v0.0.6-rc.N) publishes a public pre-release, which GitHub never
          # reports as the latest release, so the version check of a final release never offers
          # it (feature 006). On a manual run github.ref_name is the branch: the input comes first.
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
          files: |
            dist/*
          fail_on_unmatched_files: true
